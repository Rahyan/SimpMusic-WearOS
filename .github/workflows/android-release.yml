name: Build signed Android artifacts
env:
  GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3072m

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wear-companion-release:
    name: Build matching watch and companion release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches app version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          versions = tomllib.loads(pathlib.Path('gradle/libs.versions.toml').read_text())
          version = versions['versions']['version-name']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must match the app version: v' + version)
          PY
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Validate watch and companion before signing
        run: ./gradlew --no-daemon --no-configuration-cache :domain:testDebugUnitTest :common:testDebugUnitTest :wearApp:testDebugUnitTest :companionApp:testDebugUnitTest :kotlinYtmusicScraper:testDebugUnitTest :wearApp:lintRelease :companionApp:lintRelease
      - name: Prepare signing key
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: printf '%s' "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks
      - name: Build and verify matching APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        run: bash ./build_wear_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wear-companion-release
          if-no-files-found: error
          path: build/release/*
      - name: Remove local signing key
        if: always()
        run: rm -f -- simpmusic.jks

  build-full-release:
    name: Build full release version
    needs: build-wear-companion-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > ./local.properties
          printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          printf '%s' "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      - name: Build full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        run: ./build_and_sign_apk.sh --full --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release
          path: app/build/outputs/apk/full/release/*.apk
      - name: Remove local signing key
        if: always()
        run: rm -f -- simpmusic.jks

  build-foss-release:
    name: Build foss release version
    needs: build-wear-companion-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          printf '%s' "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      - name: Build foss release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        run: ./build_and_sign_apk.sh --foss --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
      - name: Remove local signing key
        if: always()
        run: rm -f -- simpmusic.jks
