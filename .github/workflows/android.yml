name: Android CI (unsigned)
permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3072m
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "asset/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "asset/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build phone debug and watch/companion debug and minified APKs
        run: ./gradlew --no-daemon --no-configuration-cache :wearApp:clean :companionApp:clean :app:assembleFossDebug :wearApp:assembleDebug :wearApp:assembleDebugAndroidTest :wearApp:assembleRelease :companionApp:assembleDebug :companionApp:assembleDebugAndroidTest :companionApp:assembleRelease

      - name: Run unit tests
        run: ./gradlew --no-daemon --no-configuration-cache :domain:testDebugUnitTest :common:testDebugUnitTest :app:testFossDebugUnitTest :wearApp:testDebugUnitTest :companionApp:testDebugUnitTest :kotlinYtmusicScraper:testDebugUnitTest

      - name: Verify watch native payload isolation
        run: |
          python3 verify_wear_apk.py wearApp/build/outputs/apk/debug/wearApp-debug.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          python3 verify_wear_apk.py wearApp/build/outputs/apk/release/wearApp-release-unsigned.apk --release --aapt2 "$aapt2"

      - name: Lint watch and companion
        run: ./gradlew --no-daemon --no-configuration-cache :wearApp:lintDebug :wearApp:lintRelease :companionApp:lintDebug :companionApp:lintRelease

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
            companionApp/build/outputs/apk/debug/*.apk

      - name: Upload unsigned minified APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-minified-apks
          if-no-files-found: error
          path: |
            wearApp/build/outputs/apk/release/wearApp-release-unsigned.apk
            companionApp/build/outputs/apk/release/companionApp-release-unsigned.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            **/build/test-results/test*UnitTest/*.xml
            wearApp/build/reports/lint-results-*
            companionApp/build/reports/lint-results-*
